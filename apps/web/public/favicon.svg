<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background gradient: Deep cerulean to cornflower -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3266"/>
      <stop offset="50%" stop-color="#124483"/>
      <stop offset="100%" stop-color="#177cc4"/>
    </linearGradient>

    <!-- Hex fill gradient: cornflower to maxblue -->
    <linearGradient id="hexgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#177cc4"/>
      <stop offset="100%" stop-color="#51abc9"/>
    </linearGradient>

    <!-- Shield gradient: eggshell to max blue light -->
    <linearGradient id="shieldgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#efecd1"/>
      <stop offset="100%" stop-color="#a8d8ea"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Outer glow for hex -->
    <filter id="hexglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip for rounded square -->
    <clipPath id="rounded">
      <rect width="64" height="64" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Subtle radial glow behind hex -->
  <circle cx="32" cy="32" r="22" fill="rgba(81,171,201,0.18)"/>

  <!-- Outer hexagon ring (stroke only, faint) -->
  <polygon
    points="32,6 54,19 54,45 32,58 10,45 10,19"
    fill="none"
    stroke="rgba(81,171,201,0.35)"
    stroke-width="1"
  />

  <!-- Inner hexagon (filled gradient) -->
  <polygon
    points="32,11 50,21.5 50,42.5 32,53 14,42.5 14,21.5"
    fill="url(#hexgrad)"
    opacity="0.22"
  />

  <!-- Shield shape — main mark -->
  <path
    d="M32 16 L44 21 L44 33 C44 40 38 46 32 48 C26 46 20 40 20 33 L20 21 Z"
    fill="url(#shieldgrad)"
    filter="url(#glow)"
  />

  <!-- Shield inner gradient overlay for depth -->
  <path
    d="M32 19 L41.5 23.2 L41.5 33 C41.5 38.8 37 44 32 45.5 C27 44 22.5 38.8 22.5 33 L22.5 23.2 Z"
    fill="rgba(23,124,196,0.28)"
  />

  <!-- Checkmark / gate mark inside shield -->
  <!-- Vertical bar (gate pillar) -->
  <rect x="30.5" y="25" width="3" height="14" rx="1.5" fill="#0D3266" opacity="0.85"/>
  <!-- Horizontal crossbar (the gate) -->
  <rect x="26" y="30" width="12" height="2.5" rx="1.25" fill="#0D3266" opacity="0.85"/>
  <!-- Top arc suggestion: small circle = lock shackle -->
  <circle cx="32" cy="25" r="3.5" fill="none" stroke="#0D3266" stroke-width="2.2" opacity="0.85"/>

  <!-- Bottom shimmer line -->
  <rect x="14" y="56" width="36" height="1.5" rx="0.75" fill="rgba(239,236,209,0.25)"/>
</svg>
